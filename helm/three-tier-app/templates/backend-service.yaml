apiVersion: v1
kind: Service
metadata:
  name: backend-service
  metadata:
  name: app-ingress
  namespace: {{ .Values.global.namespace }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
