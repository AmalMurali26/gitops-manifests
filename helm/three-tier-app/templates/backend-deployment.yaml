apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.backend.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: {{ if kindIs "map" .Values.backend.image }}"{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"{{ else if .Values.backend.tag }}"{{ .Values.backend.image }}:{{ .Values.backend.tag }}"{{ else }}"{{ .Values.backend.image }}"{{ end }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.backend.port }}
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "{{ .Values.postgres.port | default 5432 }}"
        - name: DB_NAME
          value: "{{ .Values.postgres.dbName | default "webapp" }}"
        - name: DB_USER
          value: "{{ .Values.postgres.user | default "postgres" }}"
        - name: DB_PASSWORD
          value: "{{ .Values.postgres.password | default "postgres" }}"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
