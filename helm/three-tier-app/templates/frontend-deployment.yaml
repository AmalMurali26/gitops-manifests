apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: {{ if kindIs "map" .Values.frontend.image }}"{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"{{ else if .Values.frontend.tag }}"{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"{{ else }}"{{ .Values.frontend.image }}"{{ end }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.frontend.port }}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
