apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  metadata:
  name: app-ingress
  namespace: {{ .Values.global.namespace }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
