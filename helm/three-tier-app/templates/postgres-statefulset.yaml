apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
  namespace: {{ .Values.global.namespace }}
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: "postgres:15-alpine"
        ports:
        - containerPort: {{ .Values.postgres.port | default 5432 }}
          name: postgres
        env:
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        - name: POSTGRES_DB
          value: {{ .Values.postgres.dbName | default "webapp" | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.postgres.user | default "postgres" | quote }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.postgres.password | default "postgres" | quote }}
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
