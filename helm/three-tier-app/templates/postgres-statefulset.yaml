apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
  namespace: {{ .Values.global.namespace }}
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: {{ printf "%s" .Values.postgres.image | trimSuffix ":" | quote }}
        ports:
        - containerPort: {{ .Values.postgres.port }}
          name: postgres
        env:
        - name: POSTGRES_DB
          value: {{ .Values.postgres.dbName | default "webapp" | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.postgres.user | default "postgres" | quote }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.postgres.password | default "postgres" | quote }}
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ if kindIs "map" .Values.postgres.storage }}{{ .Values.postgres.storage.size }}{{ else }}{{ .Values.postgres.storage | default "10Gi" }}{{ end }}
