apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unified-app-ingress
  namespace: three-tier-app
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      # Backend REST API
      - path: /api/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend-service
            port:
              number: 5000

      # ArgoCD
      - path: /argocd
        pathType: ImplementationSpecific
        backend:
          service:
            name: argocd-server-external
            port:
              number: 80
      - path: /argocd/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: argocd-server-external
            port:
              number: 80

      # Grafana Dashboard
      - path: /grafana
        pathType: ImplementationSpecific
        backend:
          service:
            name: argocd-server-external
            port:
              number: 80
      - path: /grafana/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: argocd-server-external
            port:
              number: 80

      # Frontend UI Fallback
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend-service
            port:
              number: 80
