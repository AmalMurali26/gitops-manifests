apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: {{ .Values.global.namespace }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.port | default 80 }}
      targetPort: {{ .Values.port | default 80 }}
      protocol: TCP
      name: http
  selector:
    app: frontend
