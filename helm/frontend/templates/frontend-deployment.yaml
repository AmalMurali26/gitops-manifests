apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: {{ if kindIs "map" .Values.image.repository }}"{{ .Values.image.repository.repository }}:{{ .Values.image.repository.tag }}"{{ else if .Values.image.tag }}"{{ .Values.image.repository }}:{{ .Values.image.tag }}"{{ else }}"{{ .Values.image.repository }}"{{ end }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
  {{- toYaml .Values.resources | nindent 12 }}

      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3

      # ─── READINESS PROBE (Routes traffic only when ready) ───
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2