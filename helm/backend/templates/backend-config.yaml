apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: backend-config
  namespace: {{ .Values.global.namespace | default "three-tier-app" }}
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 15
    healthyThreshold: 1
    unhealthyThreshold: 2
    type: HTTP
    port: {{ .Values.port | default 5000 }}
    requestPath: /health
