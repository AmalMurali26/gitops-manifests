apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudsql-db-external-secret
  namespace: { { .Values.global.namespace | default "three-tier-app" } }
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: cloudsql-db-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cloudsql-db-credentials
