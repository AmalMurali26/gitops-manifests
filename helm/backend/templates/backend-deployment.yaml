apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: gke-service-sa
      containers:
      - name: backend
        image: {{ if kindIs "map" .Values.image.repository }}"{{ .Values.image.repository.repository }}:{{ .Values.image.repository.tag }}"{{ else if .Values.image.tag }}"{{ .Values.image.repository }}:{{ .Values.image.tag }}"{{ else }}"{{ .Values.image.repository }}"{{ end }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.port | default 5000 }}
        env:
        - name: DB_HOST
          value: "127.0.0.1"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: dbname
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudsql-db-credentials
              key: password
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
        args:
          # Replace with your instance connection name: PROJECT_ID:REGION:INSTANCE_NAME
          - "--structured-logs"
          - "--port=5432"
          - "project-2f0ca310-6577-4bf2-93e:asia-south1:three-tier-db"
        securityContext:
          runAsNonRoot: true
        resources:
  {{- toYaml .Values.resources | nindent 12 }}